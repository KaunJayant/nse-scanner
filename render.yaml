services:
  - type: web
    runtime: python
    name: nse-scanner
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
